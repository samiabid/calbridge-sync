name: Sync Canary

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:

jobs:
  canary:
    if: ${{ vars.SYNC_CANARY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Force and verify the configured canary event
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${APP_BASE_URL:-}"
          test -n "${INTERNAL_CRON_TOKEN:-}"
          curl --fail --show-error --silent \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${INTERNAL_CRON_TOKEN}" \
            "${APP_BASE_URL%/}/webhook/internal/canary"
